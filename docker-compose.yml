services:
  postgres:
    image: postgres:17
    container_name: industrial-predict-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: industrial_predict
      POSTGRES_USER: industrial_user
      POSTGRES_PASSWORD: industrial_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_user -d industrial_predict"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: