name: industrial-predict-p101-local-demo
services:
  postgres:
    image: docker.io/library/postgres@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    pull_policy: never
    platform: linux/amd64
    container_name: industrial-predict-p101-local-demo-postgres
    restart: "no"
    environment:
      POSTGRES_DB: industrial_predict_p101_local_demo
      POSTGRES_USER: p101_local_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets:
      - admin_password
    command: ["postgres", "-c", "config_file=/etc/postgresql/p101.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - p101_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/p101.conf:ro
      - ${P101_LOCAL_HBA_FILE:?Explicit private generated HBA file required}:/etc/postgresql/pg_hba.conf:ro
    networks:
      p101_net:
        ipv4_address: ${P101_LOCAL_ADDRESS:?Explicit approved server address required}
    healthcheck:
      disable: true
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
volumes:
  p101_data:
    name: industrial-predict-p101-local-demo-data
networks:
  p101_net:
    name: industrial-predict-p101-local-demo-net
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: ${P101_LOCAL_SUBNET:?Explicit approved non-overlapping subnet required}
          gateway: ${P101_LOCAL_GATEWAY:?Explicit approved gateway required}
secrets:
  admin_password:
    file: ${P101_LOCAL_ADMIN_PASSWORD_FILE:?Explicit new private admin password file required}
